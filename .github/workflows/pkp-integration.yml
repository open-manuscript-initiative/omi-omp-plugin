name: PKP OMP compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pkp-omp-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omp-integration:
    name: OMP ${{ matrix.pkp-ref }} integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkp-ref: 3_5_0-4
          - pkp-ref: 3_5_0-5

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4

      - name: Prepare OMP test environment
        uses: pkp/pkp-github-actions@v1
        with:
          application: omp
          branch: ${{ matrix.pkp-ref }}
          repository: pkp
          node_version: 20
          database: mysql

      - name: Load the plugin in OMP
        shell: bash
        run: |
          set -euo pipefail
          app_dir="$HOME/omp"
          plugin_dir="$app_dir/plugins/generic/studioIntegration"
          mkdir -p "$plugin_dir"
          rsync -a --exclude='.git/' --exclude='pkp-github-actions/' "$GITHUB_WORKSPACE"/ "$plugin_dir"/
          cd "$app_dir"
          bash "$plugin_dir/.github/actions/tests.sh"
